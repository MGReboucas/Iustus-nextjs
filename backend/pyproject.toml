[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "iustus-backend"
version = "0.1.0"
description = "Fundação do backend Django da Iustus"
requires-python = ">=3.12,<3.15"
dependencies = [
  "Django>=5.2.8,<5.3",
  "djangorestframework>=3.16,<4",
  "django-environ>=0.12,<0.13",
  "psycopg[binary]>=3.2,<4",
  "pyotp>=2.10,<3",
  "cryptography>=50,<51",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "apps*", "integrations*", "jobs*"]
